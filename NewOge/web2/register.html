<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Ваш сервис</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
    <script src="/js/auth.js" defer></script>
</head>
<body class="h-full bg-gray-900">
    <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-sm">
            <img class="mx-auto h-10 w-auto" src="/images/logo.svg" alt="Логотип">
            <h2 class="mt-10 text-center text-2xl font-bold tracking-tight text-white">Создание аккаунта</h2>
            <p class="mt-2 text-center text-sm text-gray-400">
                Бесплатные генерации при регистрации!
            </p>
        </div>

        <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
            <form class="space-y-6" id="register-form" method="POST">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-200">Имя</label>
                    <div class="mt-2">
                        <input type="text" name="name" id="name" required 
                               class="block w-full rounded-md bg-gray-800 px-3 py-1.5 text-white border-0 focus:ring-2 focus:ring-indigo-600">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-200">Email</label>
                    <div class="mt-2">
                        <input type="email" name="email" id="email" required 
                               class="block w-full rounded-md bg-gray-800 px-3 py-1.5 text-white border-0 focus:ring-2 focus:ring-indigo-600">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-200">Пароль</label>
                    <div class="mt-2">
                        <input type="password" name="password" id="password" required 
                               class="block w-full rounded-md bg-gray-800 px-3 py-1.5 text-white border-0 focus:ring-2 focus:ring-indigo-600">
                        <p class="mt-1 text-xs text-gray-400">Минимум 6 символов</p>
                    </div>
                </div>

                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-gray-200">Подтверждение пароля</label>
                    <div class="mt-2">
                        <input type="password" name="confirm_password" id="confirm_password" required 
                               class="block w-full rounded-md bg-gray-800 px-3 py-1.5 text-white border-0 focus:ring-2 focus:ring-indigo-600">
                    </div>
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="terms" name="terms" required class="h-4 w-4 rounded bg-gray-800 border-gray-600 text-indigo-600">
                    <label for="terms" class="ml-2 block text-sm text-gray-300">
                        Я принимаю 
                        <a href="/terms" class="text-indigo-400 hover:text-indigo-300">условия использования</a>
                    </label>
                </div>

                <div id="error-message" class="text-red-500 text-sm hidden"></div>

                <button type="submit" class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm font-semibold text-white hover:bg-indigo-500">
                    Зарегистрироваться
                </button>
            </form>

            <p class="mt-10 text-center text-sm text-gray-400">
                Уже есть аккаунт?
                <a href="/login" class="font-semibold text-indigo-400 hover:text-indigo-300">Войдите</a>
            </p>
        </div>
    </div>
</body>
</html>
