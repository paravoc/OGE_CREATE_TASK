<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход без пароля</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            overflow: auto;
            height: auto;
            min-height: 100vh;
            background: #0f1219;  /* тёмный фон как в админке */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* macOS стильная карточка с тёмным фоном */
        .macos-card {
            background: rgba(30, 35, 45, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 180, 70, 0.2);
            border-radius: 40px;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 0 50px rgba(255, 180, 70, 0.2);
            animation: fadeInUp 0.8s ease;
            position: relative;
            overflow: hidden;
        }

        .macos-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ffb347, #8b5cf6, #ec4899);
            animation: gradientMove 3s linear infinite;
            background-size: 200% 200%;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* macOS точки */
        .macos-dots {
            display: flex;
            gap: 8px;
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
        }

        .macos-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .macos-dot.red {
            background: #ff5f56;
            border: 1px solid #e0443e;
        }
        .macos-dot.yellow {
            background: #ffbd2e;
            border: 1px solid #df9f23;
        }
        .macos-dot.green {
            background: #27c93f;
            border: 1px solid #1aab2f;
        }

        .macos-dot:hover {
            transform: scale(1.2);
            filter: brightness(1.2);
        }

        .content {
            margin-top: 2rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffb347, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            text-align: center;
        }

        .subtitle {
            color: #aaa;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #ffb347;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .macos-input {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 180, 70, 0.2);
            border-radius: 30px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
            color: white;
        }

        .macos-input:focus {
            border-color: #ffb347;
            box-shadow: 0 0 0 4px rgba(255, 180, 70, 0.1);
            background: rgba(0, 0, 0, 0.5);
        }

        .macos-input::placeholder {
            color: #666;
        }

        .macos-button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #ffb347, #ff8c00);
            color: #000;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 180, 70, 0.3);
            margin-bottom: 1rem;
        }

        .macos-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 180, 70, 0.5);
        }

        .macos-button:active {
            transform: translateY(0);
        }

        .back-link {
            text-align: center;
        }

        .back-link a {
            color: #ffb347;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: #8b5cf6;
            text-decoration: underline;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .macos-card {
                padding: 2rem 1.5rem;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="macos-card">
        <div class="macos-dots">
            <div class="macos-dot red" onclick="window.location.href='/'" title="На главную"></div>
            <div class="macos-dot yellow" onclick="window.location.reload()" title="Обновить"></div>
            <div class="macos-dot green" onclick="window.history.back()" title="Назад"></div>
        </div>
        
        <div class="content">
            <h1>🔐 Вход без пароля</h1>
            <p class="subtitle">Введите ваш email, и мы отправим ссылку для входа</p>
            
            <form id="magicForm" action="/send-magic-link" method="POST">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" class="macos-input" placeholder="your@email.com" value="danoda2004@gmail.com" required>
                </div>
                
                <button type="submit" class="macos-button">Отправить ссылку</button>
            </form>
            
            <div class="back-link">
                <a href="/login">← Вернуться к обычному входу</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('magicForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.querySelector('input[name="email"]').value;
            const button = e.target.querySelector('button');
            const originalText = button.textContent;
            
            button.disabled = true;
            button.textContent = 'Отправка...';
            
            try {
                const response = await fetch('/send-magic-link', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'email=' + encodeURIComponent(email)
                });
                
                const html = await response.text();
                document.open();
                document.write(html);
                document.close();
            } catch (error) {
                alert('Ошибка отправки. Попробуйте снова.');
                button.disabled = false;
                button.textContent = originalText;
            }
        });
    </script>
</body>
</html>
