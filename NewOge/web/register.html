<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Подготовка к экзаменам</title>
    
    <!-- Подключаем CSS для регистрации -->
    <link rel="stylesheet" href="css/register/register.css">
    
    <!-- Стили для капчи -->
    <style>
        .captcha-container {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            transform-origin: center;
        }
        @media (max-width: 400px) {
            .captcha-container {
                transform: scale(0.85);
            }
        }
    </style>
</head>
<body>
    <div class="register-page">
        <!-- Левая часть с преимуществами -->
        <div class="register-left">
            <div class="left-content-reg">
                <h1 class="reg-title">ГОТОВЬСЯ К ЭКЗАМЕНАМ</h1>
                <p class="reg-subtitle">Присоединяйся к тысячам учеников:</p>
                
                <ul class="benefits-reg">
                    <li class="benefit-reg">
                        <span class="benefit-icon">🚀</span>
                        <span>Неограниченные генерации с Premium</span>
                    </li>
                    <li class="benefit-reg">
                        <span class="benefit-icon">📊</span>
                        <span>Отслеживание прогресса</span>
                    </li>
                    <li class="benefit-reg">
                        <span class="benefit-icon">💡</span>
                        <span>Подробные решения</span>
                    </li>
                    <li class="benefit-reg">
                        <span class="benefit-icon">🎯</span>
                        <span>Все типы заданий</span>
                    </li>
                </ul>
                
                <!-- Маскот -->
                <div class="reg-mascot">
                    <img src="images/computer1.png" alt="Маскот" class="mascot-reg">
                </div>
            </div>
        </div>
        
        <!-- Правая часть с формой РЕГИСТРАЦИИ -->
        <div class="register-right">
            <div class="right-content-reg">
                <h2 class="form-title-reg">СОЗДАТЬ АККАУНТ</h2>
                
                <!-- Кнопки соцсетей -->
                <div class="social-reg">
                    <p class="social-text-reg">Быстрая регистрация через:</p>
                    <div class="social-buttons-reg">
                        <button class="social-btn-reg google" type="button" onclick="handleSocial('Google')">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath fill='%23FFC107' d='M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z'/%3E%3Cpath fill='%23FF3D00' d='M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z'/%3E%3Cpath fill='%234CAF50' d='M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z'/%3E%3Cpath fill='%231976D2' d='M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z'/%3E%3C/svg%3E" alt="Google" class="social-icon-reg">
                            Google
                        </button>
                        
                        <button class="social-btn-reg yandex" type="button" onclick="handleSocial('Yandex')">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='20' fill='%23fc0b0b'/%3E%3Cpath fill='%23FFFFFF' d='M26.682,13h-5.996c-2.539,0-3.898,1.316-3.898,3.684v2.324h3.295v-2.119c0-0.705,0.367-0.971,1.065-0.971h5.468c0.698,0,1.064,0.266,1.064,0.971v2.119h3.295v-2.324C30.58,14.316,29.22,13,26.682,13z M27.883,22.455c0-0.803-0.576-1.437-1.419-1.583l-6.967,7.38c-0.459,0.486-0.631,1.124-0.631,1.704v1.933h3.186v-2.412c0-0.245,0.083-0.468,0.241-0.631l4.61-4.909v6.396h2.979V22.455z'/%3E%3C/svg%3E" alt="Yandex" class="social-icon-reg">
                            Яндекс
                        </button>
                        
                        <button class="social-btn-reg vk" type="button" onclick="handleSocial('VK')">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='20' fill='%230077ff'/%3E%3Cpath fill='%23fff' d='M25.9 32.4c-8.2 0-12.9-5.6-13.1-15h4.1c.1 6.4 3 9.3 5.2 9.9V17.4h4.1v5.6c2.2-.2 4.5-2.8 5.3-5.6h4.1c-.6 3.4-3.1 6-4.9 7.1 1.8.9 4.7 3.2 5.8 7.9h-4.3c-.9-2.7-3.1-4.8-6-5.1v5.1h-.5z'/%3E%3C/svg%3E" alt="VK" class="social-icon-reg">
                            ВК
                        </button>
                    </div>
                    
                    <div class="social-buttons-reg second-row">
                        <button class="social-btn-reg mail" type="button" onclick="handleSocial('Mail')">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='20' fill='%233f7cb1'/%3E%3Cpath fill='%23FFFFFF' d='M33,16H15c-1.1,0-2,0.9-2,2v13c0,1.1,0.9,2,2,2h18c1.1,0,2-0.9,2-2V18C35,16.9,34.1,16,33,16z M24,27.5L15,20h18L24,27.5z'/%3E%3C/svg%3E" alt="Mail.ru" class="social-icon-reg">
                            Mail
                        </button>
                        
                        <button class="social-btn-reg ok" type="button" onclick="handleSocial('OK')">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='20' fill='%23f5821f'/%3E%3Cpath fill='%23FFFFFF' d='M24 20.5c-1.9 0-3.5 1.6-3.5 3.5s1.6 3.5 3.5 3.5 3.5-1.6 3.5-3.5-1.6-3.5-3.5-3.5zm0 8.5c-2.8 0-5-2.2-5-5s2.2-5 5-5 5 2.2 5 5-2.2 5-5 5zm3.6 3.6c-.8.8-1.9 1.3-3 1.4l.9 2.2c.2.5.8.8 1.3.6.5-.2.8-.8.6-1.3l-.9-2.2c.4-.1.7-.2 1.1-.4.5-.2.8-.8.6-1.3-.2-.5-.8-.8-1.3-.6-.9.4-1.9.6-2.9.6s-2-.2-2.9-.6c-.5-.2-1.1 0-1.3.6-.2.5 0 1.1.6 1.3.3.1.7.3 1.1.4l-.9 2.2c-.2.5.1 1.1.6 1.3.5.2 1.1-.1 1.3-.6l.8-2.2c.6 0 1.2-.2 1.7-.5z'/%3E%3C/svg%3E" alt="OK" class="social-icon-reg">
                            ОК
                        </button>
                    </div>
                </div>
                
                <div class="divider-reg">
                    <span class="divider-line-reg"></span>
                    <span class="divider-text-reg">или</span>
                    <span class="divider-line-reg"></span>
                </div>
                
                <!-- ФОРМА РЕГИСТРАЦИИ - ВАЖНО: method="post" -->
                <form class="register-form-reg" id="registerForm" action="/do_register" method="post">
                    <div class="form-group-reg">
                        <input type="text" id="regName" name="username" required>
                        <label for="regName">Имя пользователя</label>
                    </div>
                    
                    <div class="form-group-reg">
                        <input type="email" id="regEmail" name="email" required>
                        <label for="regEmail">Email</label>
                    </div>
                    
                    <div class="form-group-reg">
                        <input type="password" id="regPassword" name="pass" required>
                        <label for="regPassword">Пароль (мин. 6 символов)</label>
                    </div>
                    
                    <div class="form-group-reg">
                        <input type="password" id="regConfirm" name="confirm" required>
                        <label for="regConfirm">Подтверждение пароля</label>
                    </div>
                    
                    <div class="terms-reg">
                        <input type="checkbox" id="terms" checked disabled style="opacity: 0.5;">
                        <label for="terms" style="opacity: 0.7;">Я принимаю условия использования</label>
                    </div>
                    
                    <!-- МЕСТО ДЛЯ КАПЧИ (вставится сервером) -->
                    {{captcha}}
                    
                    <button type="submit" class="submit-btn-reg">ЗАРЕГИСТРИРОВАТЬСЯ</button>
                    
                    <p class="login-link-reg">
                        Уже есть аккаунт? <a href="/login">Войти</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Кнопка назад -->
    <a href="/" class="back-home-reg">← На главную</a>

    <!-- Подключаем JS -->
    <script src="js/register.js"></script>
</body>
</html>
