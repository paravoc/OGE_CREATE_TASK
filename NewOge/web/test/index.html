<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split Screen Animation</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Permanent+Marker&family=Rubik&family=Roboto+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <div id="left-side" class="side">
    <h2 class="title">
      Sometimes a simple header is 
      <span class="fancy">better</span>      
    </h2>
  </div>
  
  <div id="right-side" class="side">
    <h2 class="title">
      Sometimes a simple header is  
      <span class="fancy">worse</span>     
    </h2>
  </div>

  <a id="source-link" class="meta-link" href="https://superlist.com" target="_blank">
    <i class="fa-solid fa-link"></i>
    <span class="roboto-mono">Source</span>
  </a>

  <a id="yt-link" class="meta-link" href="https://youtu.be/zGKNMm4L-r4" target="_blank">
    <i class="fa-brands fa-youtube"></i>
    <span>2 min tutorial</span>
  </a>

  <script src="script.js"></script>
</body>
</html>
