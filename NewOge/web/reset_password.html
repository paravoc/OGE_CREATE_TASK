<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый пароль</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            overflow: auto;
            height: auto;
            min-height: 100vh;
            background: #0f1219;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .macos-card {
            background: rgba(30, 35, 45, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 180, 70, 0.2);
            border-radius: 40px;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 0 50px rgba(255, 180, 70, 0.2);
            animation: fadeInUp 0.8s ease;
            position: relative;
            overflow: hidden;
        }

        .macos-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ffb347, #8b5cf6, #ec4899);
            animation: gradientMove 3s linear infinite;
            background-size: 200% 200%;
        }

        .macos-dots {
            display: flex;
            gap: 8px;
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
        }

        .macos-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .macos-dot.red {
            background: #ff5f56;
            border: 1px solid #e0443e;
        }
        .macos-dot.yellow {
            background: #ffbd2e;
            border: 1px solid #df9f23;
        }
        .macos-dot.green {
            background: #27c93f;
            border: 1px solid #1aab2f;
        }

        .content {
            margin-top: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffb347, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            text-align: center;
        }

        .subtitle {
            color: #aaa;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #ffb347;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .macos-input {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 180, 70, 0.2);
            border-radius: 30px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
            color: white;
        }

        .macos-input:focus {
            border-color: #ffb347;
            box-shadow: 0 0 0 4px rgba(255, 180, 70, 0.1);
            background: rgba(0, 0, 0, 0.5);
        }

        .macos-button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #ffb347, #ff8c00);
            color: #000;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 180, 70, 0.3);
        }

        .macos-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 180, 70, 0.5);
        }

        .requirements {
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 20px;
            margin: 1.5rem 0;
            font-size: 0.85rem;
            color: #aaa;
            border: 1px solid rgba(255, 180, 70, 0.1);
        }

        .requirements ul {
            list-style: none;
            margin-top: 0.5rem;
        }

        .requirements li {
            margin: 0.3rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .requirements li::before {
            content: '•';
            color: #ffb347;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="macos-card">
        <div class="macos-dots">
            <div class="macos-dot red" onclick="window.location.href='/'" title="На главную"></div>
            <div class="macos-dot yellow" onclick="window.location.reload()" title="Обновить"></div>
            <div class="macos-dot green" onclick="window.history.back()" title="Назад"></div>
        </div>
        
        <div class="content">
            <h1>🔐 Новый пароль</h1>
            <p class="subtitle">Придумайте новый пароль для входа</p>
            
            <form id="resetPasswordForm">
                <input type="hidden" name="token" id="token" value="">
                
                <div class="form-group">
                    <label>Новый пароль</label>
                    <input type="password" name="password" id="password" class="macos-input" placeholder="••••••••" minlength="6" required>
                </div>
                
                <div class="form-group">
                    <label>Подтвердите пароль</label>
                    <input type="password" name="confirm" id="confirm" class="macos-input" placeholder="••••••••" minlength="6" required>
                </div>
                
                <div class="requirements">
                    <strong>Требования к паролю:</strong>
                    <ul>
                        <li>Минимум 6 символов</li>
                        <li>Только латинские буквы и цифры</li>
                    </ul>
                </div>
                
                <button type="submit" class="macos-button">Сменить пароль</button>
            </form>
        </div>
    </div>

    <script>
        // Получаем токен из URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            window.location.href = '/change-password';
        }
        
        document.getElementById('token').value = token;
        
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            
            if (password !== confirm) {
                alert('Пароли не совпадают');
                return;
            }
            
            if (password.length < 6) {
                alert('Пароль должен быть минимум 6 символов');
                return;
            }
            
            const button = e.target.querySelector('button');
            button.disabled = true;
            button.textContent = 'Смена...';
            
            try {
                const response = await fetch('/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        password: password
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Перенаправляем на страницу успеха
                    window.location.href = '/reset-success';
                } else {
                    alert(result.error || 'Ошибка при смене пароля');
                    button.disabled = false;
                    button.textContent = 'Сменить пароль';
                }
            } catch (error) {
                alert('Ошибка соединения');
                button.disabled = false;
                button.textContent = 'Сменить пароль';
            }
        });
    </script>
</body>
</html>
